<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Market Scanner</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      cursor: pointer;
    }

    #preview {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 10px;
      display: none;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      background: #f0f0f0;
      border-radius: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AI Market Scanner</h1>

    <p>
      Upload a screenshot of any trading chart and let the AI analyse it.
    </p>

    <input
      type="file"
      id="chartImage"
      accept="image/*"
    >

    <img id="preview" alt="Chart preview">

    <button onclick="analyseChart()">
      Analyse Chart
    </button>

    <div id="result">
      Upload a chart screenshot to begin.
    </div>

  </div>

  <script>
    const imageInput = document.getElementById("chartImage");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");

    imageInput.addEventListener("change", function () {
      const file = imageInput.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (event) {
        preview.src = event.target.result;
        preview.style.display = "block";
      };

      reader.readAsDataURL(file);
    });

    async function analyseChart() {

      const file = imageInput.files[0];

      if (!file) {
        result.textContent = "Please upload a chart screenshot first.";
        return;
      }

      result.textContent = "⏳ Analysing your chart...";

      try {

        const reader = new FileReader();

        reader.onload = async function () {

          const base64Image = reader.result;

          const response = await fetch("/api/analyze", {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              image: base64Image
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || "Analysis failed.");
          }

          result.textContent = data.analysis;

        };

        reader.readAsDataURL(file);

      } catch (error) {

        result.textContent =
          "❌ Error: " + error.message;

      }
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Market Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin-bottom: 8px;
      font-size: 32px;
    }

    .header p {
      color: #9ca3af;
    }

    .scanner-box {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      background: #1f2937;
      color: white;
      border-radius: 10px;
      border: 1px solid #374151;
      margin-bottom: 15px;
    }

    #preview {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
      margin-bottom: 15px;
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #93c5fd;
    }

    .signal-card {
      display: none;
      background: #111827;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #1f2937;
    }

    .signal-header {
      padding: 25px;
      text-align: center;
      background: #172033;
    }

    .market {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .signal {
      display: inline-block;
      padding: 10px 25px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .buy {
      background: #064e3b;
      color: #6ee7b7;
    }

    .sell {
      background: #7f1d1d;
      color: #fca5a5;
    }

    .wait {
      background: #78350f;
      color: #fcd34d;
    }

    .confidence {
      color: #d1d5db;
      margin-top: 5px;
    }

    .levels {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 20px;
    }

    .level {
      background: #1f2937;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
    }

    .level-title {
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .level-value {
      font-size: 18px;
      font-weight: bold;
    }

    .analysis {
      padding: 20px;
      border-top: 1px solid #1f2937;
    }

    .analysis h2 {
      margin-top: 0;
    }

    #analysisText {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #d1d5db;
    }

    .scan-again {
      margin: 20px;
      width: calc(100% - 40px);
      background: #374151;
    }

    .scan-again:hover {
      background: #4b5563;
    }

    .error {
      color: #fca5a5;
      background: #450a0a;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    @media (min-width: 650px) {
      .levels {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>📊 AI Market Scanner</h1>
      <p>Upload a chart screenshot and let AI analyse the market.</p>
    </div>

    <div class="scanner-box">

      <input
        type="file"
        id="chartImage"
        accept="image/*"
      >

      <img id="preview" alt="Chart preview">

      <button onclick="analyseChart()">
        🔍 Analyse Chart
      </button>

      <div id="status"></div>

    </div>

    <div id="signalCard" class="signal-card">

      <div class="signal-header">

        <div id="market" class="market">
          Market
        </div>

        <div id="signal" class="signal wait">
          WAIT
        </div>

        <div id="confidence" class="confidence">
          Confidence: —
        </div>

      </div>

      <div class="levels">

        <div class="level">
          <div class="level-title">ENTRY</div>
          <div id="entry" class="level-value">—</div>
        </div>

        <div class="level">
          <div class="level-title">STOP LOSS</div>
          <div id="stopLoss" class="level-value">—</div>
        </div>

        <div class="level">
          <div class="level-title">TP1</div>
          <div id="tp1" class="level-value">—</div>
        </div>

        <div class="level">
          <div class="level-title">TP2</div>
          <div id="tp2" class="level-value">—</div>
        </div>

      </div>

      <div class="analysis">

        <h2>📋 Full Analysis</h2>

        <div id="analysisText">
        </div>

      </div>

      <button
        class="scan-again"
        onclick="resetScanner()"
      >
        🔄 Scan Another Chart
      </button>

    </div>

  </div>


  <script>

    const imageInput = document.getElementById("chartImage");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    const signalCard = document.getElementById("signalCard");

    imageInput.addEventListener("change", function () {

      const file = imageInput.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function(event) {

        preview.src = event.target.result;
        preview.style.display = "block";

      };

      reader.readAsDataURL(file);

    });


    async function analyseChart() {

      const file = imageInput.files[0];

      if (!file) {

        status.innerHTML =
          '<div class="error">Please upload a chart screenshot first.</div>';

        return;

      }

      signalCard.style.display = "none";

      status.innerHTML =
        '<div class="loading">⏳ AI is analysing your chart...</div>';


      const reader = new FileReader();


      reader.onload = async function(event) {

        try {

          const base64Image = event.target.result;

          const response = await fetch("/api/analyze", {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              image: base64Image
            })

          });


          const data = await response.json();


          if (!response.ok) {

            throw new Error(
              data.error || "Analysis failed."
            );

          }


          const analysis = data.analysis || "";


          document.getElementById("analysisText").textContent =
            analysis;


          extractSignal(analysis);


          status.innerHTML = "";

          signalCard.style.display = "block";


        } catch (error) {

          status.innerHTML =
            '<div class="error">❌ ' +
            error.message +
            '</div>';

        }

      };


      reader.readAsDataURL(file);

    }


    function extractSignal(text) {

      const upper = text.toUpperCase();


      let signal = "WAIT";

      if (
        upper.includes("BUY") &&
        !upper.includes("SELL")
      ) {
        signal = "BUY";
      }

      else if (
        upper.includes("SELL") &&
        !upper.includes("BUY")
      ) {
        signal = "SELL";
      }


      const signalElement =
        document.getElementById("signal");


      signalElement.textContent = signal;

      signalElement.className =
        "signal " + signal.toLowerCase();


      const marketMatch =
        text.match(/(?:Instrument|Market)\s*:\s*(.+)/i);


      if (marketMatch) {

        document.getElementById("market").textContent =
          marketMatch[1].trim();

      }


      const confidenceMatch =
        text.match(/Confidence\s*:?\s*([0-9.]+)\s*(?:\/\s*10|%?)/i);


      if (confidenceMatch) {

        let confidence =
          parseFloat(confidenceMatch[1]);


        if (confidence <= 10) {
          confidence = confidence * 10;
        }


        document.getElementById("confidence").textContent =
          "Confidence: " +
          Math.round(confidence) +
          "%";

      }


      const entryMatch =
        text.match(/(?:Entry|entry area)\s*:?\s*(.+)/i);


      if (entryMatch) {

        document.getElementById("entry").textContent =
          entryMatch[1].trim();

      }


      const slMatch =
        text.match(/(?:Stop[- ]loss|SL)\s*:?\s*(.+)/i);


      if (slMatch) {

        document.getElementById("stopLoss").textContent =
          slMatch[1].trim();

      }


      const tpMatches =
        text.match(/(?:TP1|TP 1)[\s:–-]*(.+)/i);

      if (tpMatches) {

        document.getElementById("tp1").textContent =
          tpMatches[1].trim();

      }


      const tp2Matches =
        text.match(/(?:TP2|TP 2)[\s:–-]*(.+)/i);

      if (tp2Matches) {

        document.getElementById("tp2").textContent =
          tp2Matches[1].trim();

      }

    }


    function resetScanner() {

      imageInput.value = "";

      preview.src = "";

      preview.style.display = "none";

      signalCard.style.display = "none";

      status.innerHTML = "";

      document.getElementById("analysisText").textContent = "";

    }

  </script>

</body>
</html>
